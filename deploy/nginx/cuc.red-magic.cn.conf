# 1. 强制 HTTP 跳 HTTPS
server {
    listen 80;
    server_name cuc.red-magic.cn;
    return 301 https://$host$request_uri;
}

# 2. HTTPS 核心服务
server {
    listen 443 ssl;
    server_name cuc.red-magic.cn;

    # 复用 red-magic.cn 通配符证书
    ssl_certificate     /etc/nginx/ssl/red-magic.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/red-magic.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 260M;

    # Next.js 服务：页面、静态资源、Server Actions 和 /api 都由同一个 Node 进程提供
    location / {
        proxy_pass http://127.0.0.1:3014;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_connect_timeout 60s;
    }
}
